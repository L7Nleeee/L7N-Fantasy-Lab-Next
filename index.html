<style>
/* L7N H2H Fantasy Lab — design system. Dark-first, palette taken from the logo (navy / violet / electric blue / magenta). */
:root {
  --bg: #070a1c; --bg2: #0b1030; --panel: #0f1438; --panel2: #141a46; --raise: #1a2155;
  --line: rgba(160, 175, 255, .13); --line2: rgba(160, 175, 255, .22);
  --text: #e9ecff; --muted: #97a0cc; --dim: #6c76a6;
  --violet: #7c5cff; --blue: #3aa0ff; --magenta: #e04fff;
  --good: #34d399; --good-bg: rgba(52, 211, 153, .13); --bad: #fb7185; --bad-bg: rgba(251, 113, 133, .14);
  --warn: #fbbf24; --warn-bg: rgba(251, 191, 36, .13);
  --accent: linear-gradient(135deg, #7c5cff, #3aa0ff);
  --r: 12px; --r-sm: 8px; --shadow: 0 10px 30px rgba(2, 4, 20, .45);
  --top-h: 58px; --rail-w: 84px; --bottom-h: 62px; --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: radial-gradient(1200px 600px at 85% -10%, rgba(124, 92, 255, .16), transparent 60%), radial-gradient(900px 500px at -10% 110%, rgba(58, 160, 255, .10), transparent 60%), var(--bg);
  color: var(--text); font: 14px/1.5 Inter, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, -apple-system, "Segoe UI", sans-serif;
  min-height: 100vh; font-variant-numeric: tabular-nums;
}
body.no-scroll { overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.muted { color: var(--muted); } .dim { color: var(--dim); } .tiny { font-size: 12px; color: var(--muted); }
.good-t { color: var(--good); } .bad-t { color: var(--bad); }
.ic { flex: none; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); grid-template-rows: var(--top-h) minmax(0, 1fr); grid-template-areas: "top top" "rail main"; min-height: 100vh; }
.top { grid-area: top; position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: rgba(7, 10, 28, .82); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand img { width: 34px; height: 34px; border-radius: 9px; box-shadow: 0 0 0 1px var(--line2), 0 4px 18px rgba(124, 92, 255, .45); }
.brand-t { line-height: 1.1; min-width: 0; } .brand-t b { font-size: 15px; letter-spacing: .2px; white-space: nowrap; }
.brand-t small { display: block; color: var(--dim); font-size: 11px; white-space: nowrap; }
.top-sp { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255, 255, 255, .03); color: var(--text); white-space: nowrap; transition: border-color .15s, background .15s, transform .15s; }
button.chip:hover { border-color: var(--line2); background: rgba(255, 255, 255, .07); }
button.chip:active { transform: scale(.97); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
.chip .dot.ok { background: var(--good); box-shadow: 0 0 8px var(--good); } .chip .dot.warn { background: var(--warn); } .chip .dot.err { background: var(--bad); } .chip .dot.sync { background: var(--blue); animation: pulse 1s infinite; }
.chip-league { max-width: 220px; } .chip-league span { overflow: hidden; text-overflow: ellipsis; }
.icon-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 1px solid transparent; border-radius: 10px; background: transparent; color: var(--muted); transition: background .15s, color .15s, transform .15s; }
.icon-btn:hover { background: rgba(255, 255, 255, .07); color: var(--text); } .icon-btn:active { transform: scale(.94); }
.rail { grid-area: rail; position: sticky; top: var(--top-h); align-self: start; height: calc(100vh - var(--top-h)); display: flex; flex-direction: column; gap: 6px; padding: 14px 8px; border-right: 1px solid var(--line); }
.nav-btn { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px 8px; border: 0; border-radius: 12px; background: transparent; color: var(--muted); font-size: 11.5px; transition: color .15s, background .15s; }
.nav-btn:hover { color: var(--text); background: rgba(255, 255, 255, .05); }
.nav-btn.active { color: #fff; background: linear-gradient(180deg, rgba(124, 92, 255, .22), rgba(58, 160, 255, .10)); box-shadow: inset 0 0 0 1px rgba(124, 92, 255, .4); }
.nav-btn.active::before { content: ""; position: absolute; left: -9px; top: 22%; bottom: 22%; width: 3px; border-radius: 3px; background: var(--accent); }
.main { grid-area: main; min-width: 0; padding: 18px 22px 60px; max-width: 1560px; width: 100%; margin: 0 auto; }
.view { animation: viewIn .28s var(--ease) both; }
.bottomnav { display: none; }

/* ---------- primitives ---------- */
.panel { contain: layout style; background: linear-gradient(180deg, rgba(255, 255, 255, .035), rgba(255, 255, 255, .015)), var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.panel-h h3 { margin: 0; font-size: 14.5px; letter-spacing: .2px; } .panel-h .sub { color: var(--muted); font-size: 12px; }
.panel-b { padding: 14px 16px; }
.section { margin-bottom: 16px; }
.grid2 { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); gap: 16px; align-items: start; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 14px; border: 1px solid var(--line2); border-radius: 9px; background: rgba(255, 255, 255, .04); color: var(--text); white-space: nowrap; transition: background .15s, border-color .15s, transform .12s, box-shadow .15s; }
.btn:hover { background: rgba(255, 255, 255, .09); border-color: rgba(160, 175, 255, .4); } .btn:active { transform: scale(.97); }
.btn.primary { border-color: transparent; background: var(--accent); color: #fff; font-weight: 600; box-shadow: 0 4px 16px rgba(124, 92, 255, .35); }
.btn.primary:hover { filter: brightness(1.1); } .btn.danger { border-color: rgba(251, 113, 133, .5); color: var(--bad); } .btn.danger:hover { background: var(--bad-bg); }
.btn.small { height: 28px; padding: 0 10px; font-size: 12.5px; border-radius: 8px; } .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); } .btn.block { width: 100%; }
.inp, select.inp { height: 36px; width: 100%; padding: 0 12px; border: 1px solid var(--line2); border-radius: 9px; background: rgba(5, 8, 24, .6); color: var(--text); transition: border-color .15s, box-shadow .15s; }
.inp:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(58, 160, 255, .2); }
select.inp { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 17px) 15px, calc(100% - 12px) 15px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
select.inp option { background: #0f1438; }
.lbl { display: block; margin: 0 0 5px; color: var(--muted); font-size: 12px; }
.field { margin-bottom: 12px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; } .row.sp { justify-content: space-between; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.toolbar .grow { flex: 1 1 220px; min-width: 160px; position: relative; } .toolbar .inp { width: 100%; }
.seg { height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--muted); } .seg.active { background: var(--raise); color: #fff; border-color: var(--line2); }
.check { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); user-select: none; cursor: pointer; }
.check input { accent-color: var(--violet); width: 16px; height: 16px; }
.badge { display: inline-flex; align-items: center; height: 18px; padding: 0 7px; border-radius: 999px; font-size: 10.5px; font-weight: 600; letter-spacing: .2px; vertical-align: middle; border: 1px solid transparent; white-space: nowrap; }
.b-muted { color: var(--muted); border-color: var(--line2); } .b-violet { color: #c9b8ff; background: rgba(124, 92, 255, .18); border-color: rgba(124, 92, 255, .35); }
.b-amber { color: var(--warn); background: var(--warn-bg); border-color: rgba(251, 191, 36, .35); } .b-green { color: var(--good); background: var(--good-bg); border-color: rgba(52, 211, 153, .3); }
.b-blue { color: #8cc8ff; background: rgba(58, 160, 255, .14); border-color: rgba(58, 160, 255, .3); } .b-red { color: var(--bad); background: var(--bad-bg); border-color: rgba(251, 113, 133, .3); }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; margin-bottom: 12px; border-radius: 10px; border: 1px solid var(--line2); background: rgba(255, 255, 255, .04); font-size: 13px; animation: viewIn .25s var(--ease) both; }
.banner.warn { border-color: rgba(251, 191, 36, .4); background: var(--warn-bg); } .banner.error { border-color: rgba(251, 113, 133, .45); background: var(--bad-bg); } .banner.info { border-color: rgba(58, 160, 255, .35); background: rgba(58, 160, 255, .09); }
.banner .ic { margin-top: 2px; } .banner b { display: block; } .banner .btn { margin-left: auto; align-self: center; }
.empty { display: grid; justify-items: center; gap: 4px; padding: 36px 16px; color: var(--muted); text-align: center; } .empty b { color: var(--text); margin-top: 6px; } .empty p { margin: 0; max-width: 420px; font-size: 13px; }

/* ---------- avatar ---------- */

.av-sm { width: 26px; height: 26px; font-size: 10px; } .av-md { width: 36px; height: 36px; font-size: 12px; } .av-lg { width: 64px; height: 64px; font-size: 20px; } .av-xl { width: 92px; height: 92px; font-size: 28px; }
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 18%; opacity: 0; transition: opacity .35s ease; } .av.has-photo img { opacity: 1; }
.pname { display: inline-flex; align-items: center; gap: 9px; min-width: 0; } .pname .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
.plink { cursor: pointer; background: none; border: 0; padding: 0; color: var(--text); text-align: left; } .plink:hover .nm { color: #bda9ff; text-decoration: underline; text-decoration-color: rgba(189, 169, 255, .4); }
.psub { display: block; color: var(--dim); font-size: 11.5px; line-height: 1.2; white-space: nowrap; }

/* ---------- tables ---------- */

.tbl thead th { position: sticky; top: 0; z-index: 3; background: #131a47; color: var(--muted); font-size: 11.5px; font-weight: 600; letter-spacing: .3px; border-bottom: 1px solid var(--line2); user-select: none; }
.tbl th.l, .tbl td.l { text-align: left; } .tbl td.c, .tbl th.c { text-align: center; }

td.dd { color: #c9b8ff; } td.td { color: var(--dim); }
.fit { display: inline-block; min-width: 38px; padding: 2px 8px; border-radius: 999px; font-weight: 700; text-align: center; font-size: 12.5px; }
.fit.strong { color: var(--good); background: var(--good-bg); } .fit.weak { color: var(--bad); background: var(--bad-bg); } .fit.mid { color: var(--muted); background: rgba(255, 255, 255, .06); } .fit.na { color: var(--dim); background: transparent; }
tr.is-out td { opacity: .45; text-decoration: line-through; text-decoration-color: rgba(255, 255, 255, .25); } tr.is-out td.stick, tr.is-out td:first-child { text-decoration: none; }
.rank-pill { display: inline-block; min-width: 34px; padding: 1px 7px; border-radius: 7px; background: rgba(124, 92, 255, .16); color: #c9b8ff; font-weight: 700; font-size: 12px; text-align: center; }
.rank-up { color: var(--good); } .rank-down { color: var(--bad); }
.more-row { text-align: center; padding: 12px; }

/* ---------- strength board ---------- */
.sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.sbar { padding: 9px 10px 8px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255, 255, 255, .02); }
.sbar-top { display: flex; justify-content: space-between; align-items: baseline; } .sbar-top b { font-size: 13px; }
.idx { font-weight: 800; font-size: 15px; } .idx.good { color: var(--good); } .idx.bad { color: var(--bad); }
.sbar-track { position: relative; height: 8px; margin: 7px 0 5px; border-radius: 6px; background: rgba(255, 255, 255, .07); overflow: hidden; }

.advice { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; } .advice .tag { padding: 4px 10px; border-radius: 8px; font-size: 12.5px; font-weight: 600; } .tag.need { background: var(--bad-bg); color: var(--bad); } .tag.have { background: var(--good-bg); color: var(--good); }

/* ---------- what-if ---------- */
.wi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; } .wi-lbl { font-weight: 600; margin-bottom: 6px; } .wi-lbl span { color: var(--dim); font-weight: 400; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chipx { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 6px 0 10px; border-radius: 999px; border: 1px solid var(--line2); background: rgba(255, 255, 255, .04); font-size: 12.5px; transition: background .12s, border-color .12s; }
.chipx.in { border-color: rgba(52, 211, 153, .5); background: var(--good-bg); } .chipx.out { border-color: rgba(251, 113, 133, .5); background: var(--bad-bg); }
button.chipx { padding: 0 11px; } .chipx button { display: grid; place-items: center; width: 20px; height: 20px; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .1); color: var(--text); }
.delta-row { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 10px; padding: 5px 0; } .delta-bar { position: relative; height: 8px; border-radius: 5px; background: rgba(255, 255, 255, .06); }
.delta-bar i { position: absolute; top: 0; bottom: 0; border-radius: 4px; } .delta-bar i.pos { left: 50%; background: var(--good); } .delta-bar i.neg { right: 50%; background: var(--bad); } .delta-bar::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: rgba(255, 255, 255, .3); }
.scoreline { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border: 1px solid var(--line); border-radius: 11px; background: rgba(255, 255, 255, .03); margin: 10px 0; } .scoreline b { font-size: 22px; }

/* ---------- weekly ---------- */

.weekbar select { width: auto; min-width: 200px; }
.vs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; } .roster-list { display: grid; gap: 4px; }
.rl-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 10px; padding: 6px 4px; border-radius: 9px; } .rl-row:hover { background: rgba(255, 255, 255, .04); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line2); border-radius: 9px; overflow: hidden; } .stepper button { width: 28px; height: 28px; border: 0; background: rgba(255, 255, 255, .05); } .stepper button:hover { background: rgba(255, 255, 255, .12); }
.stepper b { min-width: 28px; text-align: center; } .stepper.ov b { color: var(--warn); } .stepper.as b { color: var(--warn); }
.dd-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.res-win { color: var(--good); font-weight: 700; } .res-loss { color: var(--bad); font-weight: 700; } .res-tie { color: var(--muted); }
.strategy { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; } .scard { padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, .025); } .scard h4 { margin: 0 0 8px; font-size: 13.5px; } .scard p { margin: 10px 0 0; color: var(--muted); font-size: 12.5px; }
.scard.loss { border-color: rgba(251, 113, 133, .35); } .scard.flip { border-color: rgba(251, 191, 36, .35); } .scard.win { border-color: rgba(52, 211, 153, .35); }
.stag { display: inline-block; margin: 0 6px 6px 0; padding: 3px 9px; border-radius: 8px; font-size: 12.5px; font-weight: 600; } .stag.win { background: var(--good-bg); color: var(--good); } .stag.loss { background: var(--bad-bg); color: var(--bad); } .stag.tie { background: rgba(255, 255, 255, .07); color: var(--muted); }
.close-tag { margin-left: 6px; font-size: 10.5px; color: var(--warn); }

/* ---------- schedule ---------- */
.sch td.g { text-align: center; padding: 7px 6px; min-width: 44px; font-weight: 600; } .sch th.wk { text-align: center; min-width: 44px; cursor: pointer; line-height: 1.2; } .sch th.wk span { display: block; font-weight: 400; color: var(--dim); font-size: 10px; }
.sch th.wk.cur, .sch td.cur { box-shadow: inset 2px 0 0 var(--blue), inset -2px 0 0 var(--blue); } .sch th.wk.cur { color: #fff; }
.g4 { background: rgba(124, 92, 255, .22) !important; color: #d9cfff; } .g5 { background: rgba(224, 79, 255, .26) !important; color: #f5ccff; } .g1 { color: var(--warn); } .g0 { color: var(--bad); }
.sch tr.mine td.l { box-shadow: inset 3px 0 0 var(--magenta); } .mine-n { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 9px; background: rgba(224, 79, 255, .2); color: #f0b8ff; font-size: 11px; }

/* ---------- player detail ---------- */
.detail-head { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; } .detail-head h2 { margin: 0; font-size: 22px; } .dgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; margin-top: 14px; }
.dm { padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255, 255, 255, .03); } .dm span { display: block; color: var(--muted); font-size: 11px; } .dm b { font-size: 18px; } .dm.good { border-color: rgba(52, 211, 153, .4); } .dm.good b { color: var(--good); } .dm.bad { border-color: rgba(251, 113, 133, .4); } .dm.bad b { color: var(--bad); }
.zrow { display: grid; grid-template-columns: 46px 1fr 44px; align-items: center; gap: 8px; font-size: 12px; padding: 3px 0; } .zbar { position: relative; height: 7px; border-radius: 4px; background: rgba(255, 255, 255, .06); } .zbar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; } .zbar::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: rgba(255, 255, 255, .3); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; } .kv dt { color: var(--muted); } .kv dd { margin: 0; }

/* ---------- my rank (draggable) ---------- */
.myrank { display: grid; gap: 6px; padding: 12px 16px; }
.mr-item { display: grid; grid-template-columns: 28px 30px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel2); touch-action: pan-y; transition: box-shadow .15s, border-color .15s; }
.mr-item.dragging { z-index: 5; border-color: var(--violet); box-shadow: 0 12px 28px rgba(0, 0, 0, .55), 0 0 0 1px var(--violet); background: var(--raise); }
.mr-item.over { border-color: var(--blue); } .mr-handle { display: grid; place-items: center; width: 28px; height: 32px; color: var(--muted); cursor: grab; touch-action: none; border-radius: 6px; } .mr-handle:hover { background: rgba(255, 255, 255, .08); } .mr-item.dragging .mr-handle { cursor: grabbing; }
.mr-num { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--accent); font-weight: 800; font-size: 12.5px; }
.mr-acts { display: flex; gap: 4px; }

/* ---------- drawer / modal / palette / toasts ---------- */
.drawer-back { position: fixed; inset: 0; z-index: 70; background: rgba(2, 4, 16, .6); backdrop-filter: blur(3px); opacity: 0; transition: opacity .2s; } .drawer-back.in { opacity: 1; }
.drawer { position: fixed; z-index: 71; top: 0; right: 0; bottom: 0; width: min(460px, 100vw); background: var(--bg2); border-left: 1px solid var(--line2); box-shadow: var(--shadow); transform: translateX(100%); transition: transform .28s var(--ease); display: flex; flex-direction: column; }
.drawer.in { transform: none; } .drawer-h { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); } .drawer-h h2 { margin: 0; font-size: 16px; }
.drawer-b { overflow: auto; padding: 14px 16px 40px; flex: 1; } .dsec { margin-bottom: 18px; } .dsec > h4 { margin: 0 0 10px; font-size: 12px; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); }
.wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; } .wcell { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 5px 6px 5px 10px; border: 1px solid var(--line); border-radius: 9px; background: rgba(255, 255, 255, .03); } .wcell.off { opacity: .55; } .wcell input { width: 54px; height: 28px; padding: 0 6px; text-align: right; }
.dset { width: 100%; border-collapse: collapse; font-size: 12.5px; } .dset td, .dset th { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; } .dset th { color: var(--muted); font-weight: 600; }
.modal-wrap { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 16px; background: rgba(2, 4, 16, .62); backdrop-filter: blur(3px); opacity: 0; transition: opacity .15s; } .modal-wrap.in { opacity: 1; }
.modal { width: min(440px, 100%); padding: 18px; border-radius: 14px; border: 1px solid var(--line2); background: var(--panel2); box-shadow: var(--shadow); } .modal h3 { margin: 0 0 10px; } .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.palette-wrap { position: fixed; inset: 0; z-index: 80; display: grid; align-items: start; justify-items: center; padding: 9vh 14px 14px; background: rgba(2, 4, 16, .66); backdrop-filter: blur(4px); opacity: 0; transition: opacity .14s; } .palette-wrap.in { opacity: 1; }
.palette { width: min(680px, 100%); max-height: 78vh; display: flex; flex-direction: column; border-radius: 16px; border: 1px solid var(--line2); background: var(--bg2); box-shadow: var(--shadow); overflow: hidden; transform: translateY(8px) scale(.985); transition: transform .18s var(--ease); } .palette-wrap.in .palette { transform: none; }
.palette-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); color: var(--muted); } .palette-input { flex: 1; min-width: 0; height: 34px; border: 0; background: transparent; color: var(--text); font-size: 16px; outline: none; }
.palette-targets { display: flex; gap: 6px; padding: 8px 14px; border-bottom: 1px solid var(--line); } .palette-results { overflow: auto; padding: 6px; min-height: 120px; }
.qa-row { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 10px; } .qa-row.sel, .qa-row:hover { background: rgba(124, 92, 255, .14); } .qa-main { flex: 1; min-width: 0; } .qa-name { font-weight: 600; } .qa-sub { font-size: 12px; color: var(--muted); }
.toasts { position: fixed; z-index: 100; left: 50%; bottom: 22px; transform: translateX(-50%); display: grid; gap: 8px; width: min(420px, calc(100vw - 24px)); pointer-events: none; }
.toast { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line2); background: #151c4a; box-shadow: var(--shadow); opacity: 0; transform: translateY(10px); transition: opacity .22s, transform .22s var(--ease); } .toast.in { opacity: 1; transform: none; }
.toast-ok { border-color: rgba(52, 211, 153, .5); } .toast-warn { border-color: rgba(251, 191, 36, .5); } .toast-error { border-color: rgba(251, 113, 133, .55); }
.fab { display: none; }
.help-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; } .help-item { padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255, 255, 255, .03); } .help-item h4 { margin: 0 0 6px; font-size: 13.5px; } .help-item p { margin: 0; font-size: 12.5px; color: var(--muted); }
.kbd { padding: 1px 6px; border: 1px solid var(--line2); border-radius: 5px; font-size: 11px; color: var(--muted); }

/* ---------- candidate cards (mobile) ---------- */
.cand-cards { display: none; }
.ccard { padding: 12px; border-bottom: 1px solid var(--line); } .ccard.is-out { opacity: .5; }
.ccard-top { display: flex; align-items: center; gap: 10px; } .ccard-top .grow { flex: 1; min-width: 0; } .ccard-fits { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.cstats { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; } .cs { text-align: center; padding: 4px 0; border-radius: 6px; background: rgba(255, 255, 255, .04); font-size: 12px; } .cs small { display: block; color: var(--dim); font-size: 9.5px; } .cs.good { background: var(--good-bg); color: var(--good); } .cs.bad { background: var(--bad-bg); color: var(--bad); }
.ccard-acts { display: flex; gap: 6px; margin-top: 8px; }

/* ---------- motion ---------- */
@keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes pulse { 50% { opacity: .35; } }
tbody.enter tr { animation: viewIn .22s var(--ease) both; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; } }
body.reduce-motion *, body.reduce-motion *::before, body.reduce-motion *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }

/* ---------- responsive ---------- */
@media (max-width: 1100px) { .grid2 { grid-template-columns: 1fr; } .strategy { grid-template-columns: 1fr; } }
@media (max-width: 820px) {
  :root { --top-h: 54px; }
  .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "main"; }
  .rail { display: none; } .main { padding: 12px 10px calc(var(--bottom-h) + 76px); }
  .brand-t, .chip-data .lbl, .hide-m { display: none; } .top { padding: 0 10px; gap: 6px; } .chip { padding: 0 10px; height: 36px; } .chip-league { max-width: 38vw; } .chip-league span { max-width: 28vw; }
  .pulse-cards { grid-auto-flow: column; grid-auto-columns: 128px; grid-template-columns: none; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; } .pulse-cards .metric { padding: 9px 11px; } .pulse-cards .metric b { font-size: 18px; }
  .bottomnav { display: grid; grid-template-columns: repeat(7, 1fr); position: fixed; z-index: 45; left: 0; right: 0; bottom: 0; height: calc(var(--bottom-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: rgba(9, 12, 34, .94); backdrop-filter: blur(14px); border-top: 1px solid var(--line2); }
  .bottomnav .nav-btn { border-radius: 0; font-size: 10.5px; padding: 8px 2px; } .bottomnav .nav-btn.active { background: transparent; box-shadow: none; color: #fff; } .bottomnav .nav-btn.active::before { left: 25%; right: 25%; top: 0; bottom: auto; width: auto; height: 3px; }
  .fab { display: grid; place-items: center; position: fixed; z-index: 46; right: 14px; bottom: calc(var(--bottom-h) + 14px + env(safe-area-inset-bottom)); width: 54px; height: 54px; border: 0; border-radius: 50%; background: var(--accent); color: #fff; box-shadow: 0 8px 24px rgba(124, 92, 255, .55); transition: transform .15s; } .fab:active { transform: scale(.92); }
  .wi-grid, .vs-grid { grid-template-columns: 1fr; } .dd-cards { grid-template-columns: 1fr 1fr 1fr; } .sgrid { grid-template-columns: repeat(2, 1fr); }
  .cand-desktop { display: none; } .cand-cards { display: block; } .drawer { width: 100vw; } .palette-wrap { padding-top: 4vh; } .palette { max-height: 88vh; }
  .toasts { bottom: calc(var(--bottom-h) + 78px); } .tbl-wrap.tall, .tbl-wrap.mid { max-height: 68vh; } .tbl th, .tbl td { padding: 7px 8px; } .pname .nm { max-width: 120px; }
  .panel-h { padding: 10px 12px; } .panel-b { padding: 12px; } .toolbar { padding: 10px 12px; }
}

/* ---------- additions ---------- */
.p-projection td { font-style: italic; } .p-historical td.good, .p-historical td.bad { background-image: none; }

.pos-rel { position: relative; }
.games-cell { white-space: nowrap; } .stepper.sm button { width: 24px; height: 24px; } .stepper.sm b { min-width: 22px; font-size: 12.5px; }

/* ---------- official NBA headshots ---------- */

.av.loaded .av-img { opacity: 1; } .av.has-nba { cursor: zoom-in; } .av.has-nba:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 50%; }
.av-preview { position: fixed; z-index: 95; width: 240px; padding: 8px; border-radius: 14px; border: 1px solid var(--line2); background: var(--bg2); box-shadow: 0 16px 40px rgba(2, 4, 20, .6); opacity: 0; transform: scale(.96); transition: opacity .14s ease, transform .16s var(--ease); pointer-events: none; }
.av-preview.in { opacity: 1; transform: none; } .av-preview img { display: block; width: 224px; height: 164px; object-fit: cover; object-position: center top; border-radius: 9px; background: linear-gradient(135deg, #1a2155, #0b1030); aspect-ratio: 1040 / 760; }
.av-preview-cap { margin-top: 6px; font-weight: 600; font-size: 13px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (hover: none) { .av-preview { pointer-events: auto; } }

/* ---------- trend tags & pickup rows (v5.2 Weekly H2H) ---------- */
.trend-tag { display: inline-flex; align-items: center; height: 17px; padding: 0 6px; border-radius: 999px; font-size: 10px; font-weight: 700; margin-left: 4px; white-space: nowrap; vertical-align: middle; }
.t-green, .t-surge { background: var(--good-bg); color: var(--good); border: 1px solid rgba(52,211,153,.3); }
.t-amber, .t-down  { background: var(--warn-bg); color: var(--warn); border: 1px solid rgba(251,191,36,.3); }
.t-red, .t-cold    { background: var(--bad-bg);  color: var(--bad);  border: 1px solid rgba(251,113,133,.35); }

.pickup-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.pickup-row:last-child { border-bottom: 0; }
.pickup-stats { flex: 1; min-width: 200px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }

#wkBasisPanel { margin-bottom: 0; border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom: 0; }
#wkBasisPanel + .vs-grid { position: relative; }

/* ---------- mobile player cards (v5.3) ---------- */
.pcards { display: grid; gap: 0; }
.pcard { padding: 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
.pcard-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.pcard-top .grow { flex: 1; min-width: 0; }
.pcard-fit { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.pcard-fit .fit { min-width: 40px; font-size: 14px; }
.pcard-fit .tiny { color: var(--dim); }
.pc-stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-bottom: 8px; }
.pc-stat { text-align: center; padding: 5px 2px; border-radius: 7px; background: rgba(255,255,255,.04); font-size: 12px; font-weight: 600; }
.pc-stat small { display: block; color: var(--dim); font-size: 9.5px; font-weight: 400; margin-bottom: 1px; }
.pc-stat.good { background: var(--good-bg); color: var(--good); }
.pc-stat.bad { background: var(--bad-bg); color: var(--bad); }
.pcard-acts { display: flex; align-items: center; gap: 8px; }

/* ---------- radar chart layout (v5.3) ---------- */
.radar-layout { display: grid; grid-template-columns: 340px 1fr; gap: 20px; align-items: start; }
.radar-chart-wrap { width: 100%; max-width: 340px; }
.radar-bars { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
.radar-unavail { grid-column: 1 / -1; }
@media (max-width: 820px) {
  .radar-layout { grid-template-columns: 1fr; }
  .radar-chart-wrap { max-width: 300px; margin: 0 auto; }
}

.cat-result-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 6px; margin-top: 4px; }
.cat-cell { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 4px; border: 1px solid var(--line); border-radius: 9px; background: rgba(255,255,255,.02); }
.cat-label { font-size: 11px; font-weight: 700; color: var(--muted); }
.cat-btns { display: flex; gap: 3px; }
.cat-btn { width: 26px; height: 22px; border: 1px solid var(--line2); border-radius: 6px; background: transparent; color: var(--muted); font-size: 11px; font-weight: 700; cursor: pointer; transition: background .12s, color .12s; }
.cat-btn:hover { background: rgba(255,255,255,.08); color: var(--text); }
.cat-btn.active[data-val="win"]  { background: var(--good-bg); color: var(--good); border-color: rgba(52,211,153,.4); }
.cat-btn.active[data-val="loss"] { background: var(--bad-bg);  color: var(--bad);  border-color: rgba(251,113,133,.4); }
.cat-btn.active[data-val="tie"]  { background: rgba(255,255,255,.08); color: var(--text); border-color: var(--line2); }
.result-btn { min-width: 64px; height: 34px; } .result-btn.active[data-res="W"] { background: var(--good-bg); color: var(--good); border-color: rgba(52,211,153,.5); }
.result-btn.active[data-res="L"] { background: var(--bad-bg);  color: var(--bad);  border-color: rgba(251,113,133,.5); }
.result-btn.active[data-res="T"] { background: rgba(255,255,255,.08); color: var(--muted); }

.hrow-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* ---------- compact advice pills + 2-col strength grid (v5.3.1) ---------- */

.cat-rm:hover { color: var(--bad); }
.cat-add { border-style: dashed; border-color: var(--line2); opacity: .7; cursor: pointer; }
.cat-add:hover { opacity: 1; border-color: var(--blue); }
.cat-add-btn { background: none; border: none; cursor: pointer; color: var(--blue); font-size: 13px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 6px; width: 100%; }
.cat-add-btn span { font-size: 9px; font-weight: 400; color: var(--muted); }

.opp-chip:hover { background: rgba(58,160,255,.2); }
.opp-rm { color: var(--muted); font-size: 12px; border: none; background: none; cursor: pointer; opacity: .6; }
.opp-rm:hover { color: var(--bad); opacity: 1; }

.stats-entry-grid { display: grid; gap: 6px; }
.stat-entry-row { display: grid; grid-template-columns: 90px 1fr 1fr; gap: 8px; align-items: center; }
.stat-entry-label { font-size: 12px; font-weight: 700; color: var(--text); }
.stat-inp { height: 32px; font-size: 13px; text-align: center; padding: 0 8px; }
.actual-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
.actual-card { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 6px; border-radius: 10px; background: rgba(58,160,255,.08); border: 1px solid rgba(58,160,255,.2); }

  document.body.appendChild(overlay);
  // close when clicking the backdrop (not the panel itself)
  overlay.addEventListener('click', (e) => { if (e.target === overlay) { detailId=null; detailEditMode=false; Object.keys(detailStatsIn).forEach((k)=>delete detailStatsIn[k]); overlay.hidden=true; } });

  root.innerHTML = `
<div class="panel section">
  <div class="panel-h"><h3>📋 記錄本週對戰結果</h3><span class="sub">每週手動輸入一次，累積後自動分析強弱趨勢</span></div>
  <div class="panel-b" id="hForm">
    <div class="row" style="flex-wrap:wrap;gap:12px;align-items:flex-start">
      <div class="field" style="flex:2;min-width:180px"><label class="lbl">賽週</label><select class="inp" id="hWeekSel">${WEEKS.map((w,i)=>`<option value="${i}">${w[0]} · ${w[1]}</option>`).join('')}</select></div>
      <div class="field" style="flex:2;min-width:160px"><label class="lbl">對手名稱（可省略）</label><input class="inp" id="hOppName" placeholder="對手聯盟名" maxlength="40"></div>
      <div class="field" style="flex:0"><label class="lbl">結果</label>
        <div class="row" style="gap:6px">
          <button class="btn result-btn" data-res="W" data-testid="hres-W">✅ 勝</button>
          <button class="btn result-btn" data-res="L" data-testid="hres-L">❌ 敗</button>
          <button class="btn result-btn" data-res="T" data-testid="hres-T">🤝 和</button>
        </div>
      </div>
    </div>
    <div class="field"><label class="lbl">各分類結果（可選）</label><div class="cat-result-grid" id="hCatGrid"></div></div>
    <div class="panel section" style="margin:14px 0 0;padding:0">
      <div class="panel-h" style="padding:10px 14px 6px;cursor:pointer" id="hStatsToggle">
        <h4 style="margin:0;font-size:13px">📊 本週詳細數據（可選，但填了就能分析你的實際平均值）</h4>
        <span class="sub" id="hStatsToggleIcon">▶ 展開輸入</span>
      </div>
      <div id="hStatsPanel" hidden>
        <div style="padding:0 14px 10px">
          <p class="tiny muted" style="margin:0 0 10px">輸入你這週的實際統計數字（依照你聯盟的計分項目）。填越多，「我的陣容本季實際表現」分析就越準確。</p>
          <div class="stats-entry-grid" id="hStatsGrid"></div>
        </div>
      </div>
    </div>
    <div class="row" style="gap:8px;margin-top:12px">
      <input class="inp" id="hNote" placeholder="備注（可省略）" style="flex:1" maxlength="80">
      <button class="btn primary" id="hSave" data-testid="h-save" disabled>${icon('check',14)}儲存記錄</button>
    </div>
  </div>
</div>
<div class="panel section" id="hAnalysisPanel">
  <div class="panel-h"><h3>📊 勝負趨勢分析</h3><span class="sub" id="hAnalysisSub"></span></div>
  <div class="panel-b" id="hAnalysis"></div>
</div>
<div class="panel section" id="hActualPanel" hidden>
  <div class="panel-h"><h3>🏀 我的陣容本季實際平均</h3><span class="sub" id="hActualSub"></span></div>
  <div class="panel-b" id="hActual"></div>
</div>
<div class="panel section">
  <div class="panel-h"><h3>📅 歷史記錄</h3><button class="btn small ghost" data-act="clear-all" data-testid="h-clear-all">清除全部</button></div>
  <div id="hList" data-testid="h-list"></div>
</div>
`;

  let selectedResult = null;
  const catState = {};
  const statsIn = {};    // label -> {my: string, opp: string}
  let statsOpen = false;
  const storage = () => app.storage;
  const allCats = () => [...new Set([...(app.profile.h2hCategories.length ? app.profile.h2hCategories : DEFAULT_H2H_CATS), ...(app.profile.customH2HCats||[])])];
  const allStats = () => [...new Set([...STAT_LABELS, ...(app.profile.customH2HCats||[])])];

  // ---------- cat grid ----------
  function initCatGrid() {
    const cats = allCats();
    const custom = app.profile.customH2HCats || [];
    const cell = (c, isCustom) => `<div class="cat-cell${isCustom?' cat-custom':''}" data-cat="${esc(c)}">
      <span class="cat-label">${esc(c)}${isCustom?`<button class="cat-rm" data-rm="${esc(c)}">×</button>`:''}</span>
      <div class="cat-btns">
        <button class="cat-btn" data-cat="${esc(c)}" data-val="win">W</button>
        <button class="cat-btn" data-cat="${esc(c)}" data-val="tie">-</button>
        <button class="cat-btn" data-cat="${esc(c)}" data-val="loss">L</button>
      </div></div>`;
    $('#hCatGrid').innerHTML = cats.map((c)=>cell(c,custom.includes(c))).join('')
      +`<div class="cat-cell cat-add"><button class="cat-add-btn" data-act="add-cat">＋<span>新增</span></button></div>`;
    cats.forEach((c)=>{ if(!(c in catState)) catState[c]=null; });
    Object.keys(catState).forEach((k)=>{ if(!cats.includes(k)) delete catState[k]; });
    // restore button states
    root.querySelectorAll('.cat-btn').forEach((b)=>{ b.classList.toggle('active', catState[b.dataset.cat]===b.dataset.val); });
  }

  // ---------- stats entry grid ----------
  function initStatsGrid() {
    const labels = allStats();
    labels.forEach((l)=>{ if(!statsIn[l]) statsIn[l]={my:'',opp:''}; });
    $('#hStatsGrid').innerHTML = labels.map((l)=>`
      <div class="stat-entry-row">
        <span class="stat-entry-label">${esc(l)}${REVERSE_LABELS.has(l)?'<span class="tiny muted"> (低佳)</span>':''}</span>
        <input class="inp stat-inp" data-stat="${esc(l)}" data-side="my"  placeholder="我方" value="${esc(statsIn[l]?.my||'')}" inputmode="decimal">
        <input class="inp stat-inp" data-stat="${esc(l)}" data-side="opp" placeholder="對手" value="${esc(statsIn[l]?.opp||'')}" inputmode="decimal">
      </div>`).join('');
  }

  function toggleStats() {
    statsOpen = !statsOpen;
    $('#hStatsPanel').hidden = !statsOpen;
    $('#hStatsToggleIcon').textContent = statsOpen ? '▼ 收起' : '▶ 展開輸入';
    if (statsOpen) initStatsGrid();
  }

  function parseStats() {
    const my = {}; const opp = {};
    for (const [l, v] of Object.entries(statsIn)) {
      const mv = parseFloat(v.my); const ov = parseFloat(v.opp);
      my[l]  = isNaN(mv) ? null : mv;
      opp[l] = isNaN(ov) ? null : ov;
    }
    return { my, opp };
  }

  function updateSaveBtn() { $('#hSave').disabled = !selectedResult; }

  // ---------- events ----------
  on(root, 'click', '.result-btn', (e,t) => {
    selectedResult = t.dataset.res;
    root.querySelectorAll('.result-btn').forEach((b)=>b.classList.remove('active'));
    t.classList.add('active'); updateSaveBtn();
  });
  on(root, 'click', '.cat-btn', (e,t) => {
    const c=t.dataset.cat; const v=t.dataset.val;
    catState[c] = catState[c]===v ? null : v;
    root.querySelectorAll(`.cat-btn[data-cat="${CSS.escape(c)}"]`).forEach((b)=>b.classList.toggle('active',b.dataset.val===catState[c]));
  });
  on(root, 'input', '.stat-inp', (e,t) => {
    const l=t.dataset.stat; const side=t.dataset.side;
    if (t.classList.contains('detail-inp')) {
      if (!detailStatsIn[l]) detailStatsIn[l]={my:'',opp:''};
      detailStatsIn[l][side]=t.value;
    } else {
      if (!statsIn[l]) statsIn[l]={my:'',opp:''};
      statsIn[l][side]=t.value;
    }
  });
  $('#hStatsToggle').addEventListener('click', toggleStats);
  on(root, 'click', '.cat-rm', (e,t)=>{ e.stopPropagation(); app.removeCustomCat(t.dataset.rm); initCatGrid(); initStatsGrid(); });
  on(root, 'click', '[data-act="add-cat"]', ()=>{
    const name = window.prompt('輸入新競賽項目名稱（如 T、TD）：');
    if (!name) return;
    const r = app.addCustomCat(name);
    if (!r.ok) { toast(r.error,{level:'warn'}); return; }
    initCatGrid(); initStatsGrid();
  });

  $('#hSave').addEventListener('click', ()=>{
    if (!selectedResult) return;
    const week = Number($('#hWeekSel').value);
    const wl = WEEKS[week];
    const catResults = Object.fromEntries(Object.entries(catState).filter(([,v])=>v));
    const { my, opp } = statsOpen ? parseStats() : { my: null, opp: null };
    const hasStats = my && Object.values(my).some((v)=>v!=null);
    const match = {
      id: `m_${Date.now()}_${Math.random().toString(36).slice(2,6)}`,
      week, weekLabel: wl?.[0]??`W${week+1}`, season:'2026-27',
      result: selectedResult,
      score: { w: Object.values(catResults).filter((v)=>v==='win').length, l: Object.values(catResults).filter((v)=>v==='loss').length, t: Object.values(catResults).filter((v)=>v==='tie').length },
      catResults, opponent: $('#hOppName').value.trim()||null, note: $('#hNote').value.trim()||null,
      myStats: hasStats ? my : null, oppStats: hasStats ? opp : null,
      recordedAt: new Date().toISOString(),
    };
    const ok = saveHistory(storage(), addMatch(loadHistory(storage()), app.activeId, match));
    if (!ok.ok) { toast('儲存失敗：'+ok.error,{level:'error'}); return; }
    toast(`第 ${wl?.[0]} 週 ${RESULT_LABEL[selectedResult]} 已記錄${hasStats?' · 含本週數據':''}`,{level:'ok'});
    // reset
    selectedResult=null; root.querySelectorAll('.result-btn').forEach((b)=>b.classList.remove('active'));
    Object.keys(catState).forEach((k)=>{ catState[k]=null; });
    Object.keys(statsIn).forEach((k)=>{ statsIn[k]={my:'',opp:''}; });
    root.querySelectorAll('.cat-btn,.stat-inp').forEach((el)=>{ if(el.classList.contains('cat-btn')) el.classList.remove('active'); else el.value=''; });
    $('#hOppName').value=''; $('#hNote').value=''; updateSaveBtn();
    if (statsOpen) toggleStats();
    render();
  });

  // detail overlay events (delegated on body since overlay is outside root)
  overlay.addEventListener('click', async (e) => {
    const t=e.target.closest('[data-act]'); if (!t) return;
    const a=t.dataset.act;
    if (a==='close-detail') {
      detailId=null; detailEditMode=false; Object.keys(detailStatsIn).forEach((k)=>delete detailStatsIn[k]); overlay.hidden=true;
    } else if (a==='detail-edit-stats') {
      detailEditMode=true; renderDetail();
    } else if (a==='detail-cancel-edit') {
      detailEditMode=false; renderDetail();
    } else if (a==='detail-save-stats') {
      detailBox.querySelectorAll('.detail-inp').forEach((el)=>{
        const l=el.dataset.stat; const side=el.dataset.side;
        if (!detailStatsIn[l]) detailStatsIn[l]={my:'',opp:''};
        detailStatsIn[l][side]=el.value;
      });
      const my={}; const opp={};
      for (const [l,v] of Object.entries(detailStatsIn)) {
        const mv=parseFloat(v.my); const ov=parseFloat(v.opp);
        my[l]=isNaN(mv)?null:mv; opp[l]=isNaN(ov)?null:ov;
      }
      const hasAny = Object.values(my).some((v)=>v!=null);
      const all2=loadHistory(storage()); const matches2=getLeagueMatches(all2,app.activeId);
      const m2=matches2.find((x)=>x.id===detailId); if (!m2) return;
      const updated={...m2, myStats:hasAny?my:m2.myStats, oppStats:hasAny?opp:m2.oppStats};
      const ok=saveHistory(storage(), addMatch(all2, app.activeId, updated));
      if (!ok.ok) { toast('儲存失敗：'+ok.error,{level:'error'}); return; }
      toast('數據已補填並儲存',{level:'ok'});
      detailEditMode=false; Object.keys(detailStatsIn).forEach((k)=>delete detailStatsIn[k]);
      renderDetail(); render();
    }
  });
  overlay.addEventListener('input', (e) => {
    const t=e.target; if (!t.classList.contains('detail-inp')) return;
    const l=t.dataset.stat; const side=t.dataset.side;
    if (!detailStatsIn[l]) detailStatsIn[l]={my:'',opp:''};
    detailStatsIn[l][side]=t.value;
  });

  on(root, 'click', '[data-act]', async (e,t)=>{
    const a=t.dataset.act;
    if (a==='delete-match') {
      if (!await askConfirm({title:'刪除這筆記錄？',ok:'刪除',danger:true})) return;
      saveHistory(storage(), deleteMatch(loadHistory(storage()), app.activeId, t.dataset.id)); render();
    } else if (a==='clear-all') {
      if (!await askConfirm({title:'清除所有歷史記錄？',ok:'清除',danger:true})) return;
      const all=loadHistory(storage()); delete all[app.activeId]; saveHistory(storage(),all); render();
    } else if (a==='open-detail') {
      detailId=t.dataset.id; renderDetail();
    }
  });

  // ---------- detail panel ----------
  // track whether we are in edit-stats mode inside the detail panel
  let detailEditMode = false;
  const detailStatsIn = {};   // label -> {my, opp}

  function renderDetail() {
    const all=loadHistory(storage()); const matches=getLeagueMatches(all,app.activeId);
    const m=matches.find((x)=>x.id===detailId); if (!m) return;
    const hasStats = m.myStats && Object.values(m.myStats).some((v)=>v!=null);
    const allLabels = [...new Set([...Object.keys(m.catResults||{}), ...allStats()])];

    if (detailEditMode) {
      // ---- edit / fill-in mode ----
      allLabels.forEach((l)=>{
        if (!detailStatsIn[l]) detailStatsIn[l]={ my: m.myStats?.[l]!=null?String(m.myStats[l]):'', opp: m.oppStats?.[l]!=null?String(m.oppStats[l]):'' };
      });
      const rows = allLabels.map((l)=>`
        <div class="stat-entry-row">
          <span class="stat-entry-label">${esc(l)}${REVERSE_LABELS.has(l)?'<span class="tiny muted"> (低佳)</span>':''}</span>
          <input class="inp stat-inp detail-inp" data-stat="${esc(l)}" data-side="my"  placeholder="我方" value="${esc(detailStatsIn[l]?.my||'')}" inputmode="decimal">
          <input class="inp stat-inp detail-inp" data-stat="${esc(l)}" data-side="opp" placeholder="對手" value="${esc(detailStatsIn[l]?.opp||'')}" inputmode="decimal">
        </div>`).join('');
      detailBox.innerHTML=`
        <div class="panel-h"><h3>${esc(m.weekLabel)} ${m.opponent?`vs ${esc(m.opponent)}`:''} <span class="sub">補填數據</span></h3><button class="icon-btn" data-act="close-detail" style="margin-left:auto">${icon('close',18)}</button></div>
        <div class="panel-b">
          <div class="row" style="gap:8px;margin-bottom:4px"><span class="tiny muted">每行左欄為我方，右欄為對手。不改的欄位留空或保留原值。</span></div>
          <div class="stats-entry-grid" id="hDetailStatsGrid" style="margin-top:8px">${rows}</div>
          <div class="row" style="gap:8px;margin-top:14px">
            <button class="btn" data-act="detail-cancel-edit">取消</button>
            <button class="btn primary" data-act="detail-save-stats">${icon('check',14)}儲存數據</button>
          </div>
        </div>`;
    } else {
      // ---- read mode ----
      const viewLabels = [...new Set([...Object.keys(m.catResults||{}), ...Object.keys(m.myStats||{}), ...Object.keys(m.oppStats||{})])];
      const rows = viewLabels.map((l)=>{
        const res=m.catResults?.[l]; const mv=m.myStats?.[l]; const ov=m.oppStats?.[l];
        const resCell = res ? `<span class="hcat-tag ${res}">${res==='win'?'W':res==='loss'?'L':'—'}</span>` : '—';
        const mClass = mv!=null&&ov!=null ? (mv>ov?'good':'bad') : '';
        return `<tr><td class="l"><b>${esc(l)}</b></td><td>${resCell}</td><td class="${mClass}">${f(mv,l)}</td><td>${f(ov,l)}</td></tr>`;
      }).join('');
      detailBox.innerHTML=`
        <div class="panel-h">
          <h3>${esc(m.weekLabel)} ${m.opponent?`vs ${esc(m.opponent)}`:''}</h3>
          <div class="row" style="gap:6px;margin-left:auto">
            <button class="btn small" data-act="detail-edit-stats" data-testid="detail-edit-stats">${icon('edit',13)} ${hasStats?'編輯數據':'補填數據'}</button>
            <button class="icon-btn" data-act="close-detail">${icon('close',18)}</button>
          </div>
        </div>
        <div class="panel-b">
          <div class="row" style="gap:16px;margin-bottom:14px">
            <div class="metric"><b class="${RESULT_CLS[m.result]}">${RESULT_LABEL[m.result]}</b><span>結果</span></div>
            ${m.score.w||m.score.l?`<div class="metric"><b>${m.score.w}W–${m.score.l}L${m.score.t?'–'+m.score.t+'T':''}</b><span>分類比分</span></div>`:''}
            <div class="metric"><b>${esc(m.season)}</b><span>賽季</span></div>
          </div>
          ${rows.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="l">項目</th><th>勝負</th><th>我方</th><th>對手</th></tr></thead><tbody>${rows}</tbody></table></div>`:
            `<div class="banner info">${icon('info',15)}<div>這週還沒有填數據。點右上角「補填數據」直接在這裡輸入。</div></div>`}
          ${m.note?`<p class="tiny muted" style="margin-top:10px">備注：${esc(m.note)}</p>`:''}
        </div>`;
    }
    overlay.hidden=false; overlay.scrollTop=0;
  }

  // ---------- actual averages panel ----------
  function renderActual(matches) {
    const ds=buildActualDataset(matches);
    const panel=$('#hActualPanel'); const box=$('#hActual');
    if (!ds) { panel.hidden=true; return; }
    panel.hidden=false;
    $('#hActualSub').textContent=`${ds.weeks} 週有數據 · 以下為你陣容的實際週均值`;
    const labels=Object.keys(ds.avgs).sort();
    box.innerHTML=`<div class="actual-grid">${labels.map((l)=>{
      const v=ds.avgs[l]; const pctLbl=PCT_LABELS.has(l);
      return `<div class="actual-card"><span class="tiny muted">${esc(l)}</span><b>${pctLbl?(v*100).toFixed(1)+'%':v.toFixed(pctLbl?3:1)}</b></div>`;
    }).join('')}</div>
    <p class="tiny muted" style="margin-top:10px">這是基於你手動輸入的實際比賽統計，不是 App 的預測值。可作為「我的陣容實際表現」與 App 預測值對照的參考。</p>`;
  }

  // ---------- main render ----------
  function render() {
    $('#hWeekSel').value=String(app.profile.week);
    initCatGrid(); if (statsOpen) initStatsGrid();
    const all=loadHistory(storage()); const matches=getLeagueMatches(all,app.activeId);
    const analysis=analyzeHistory(matches);
    renderActual(matches);

    // analysis
    const ap=$('#hAnalysis');
    if (!analysis) { $('#hAnalysisSub').textContent=''; ap.innerHTML=emptyState('還沒有記錄','先在上方輸入本週的對戰結果，累積幾週後這裡就會出現趨勢圖表。','info'); }
    else {
      const {total,cats,strong,weak,rolling}=analysis;
      $('#hAnalysisSub').textContent=`${analysis.matchCount} 場 · ${total.W}勝${total.L}敗${total.T?total.T+'和':''}`;
      const winPct=analysis.matchCount?(total.W/analysis.matchCount*100).toFixed(1):'0';
      ap.innerHTML=`<div class="pulse-cards" style="margin-bottom:16px">
        <div class="metric"><b>${total.W}–${total.L}${total.T?'–'+total.T:''}</b><span>整季戰績</span></div>
        <div class="metric"><b>${winPct}%</b><span>勝率</span></div>
        ${strong.length?`<div class="metric"><b style="font-size:14px;color:var(--good)">${strong.map((c)=>c.label).join(' · ')}</b><span>真實強項（≥60%）</span></div>`:''}
        ${weak.length?`<div class="metric"><b style="font-size:14px;color:var(--bad)">${weak.map((c)=>c.label).join(' · ')}</b><span>真實弱項（≤40%）</span></div>`:''}
      </div>
      ${rolling.length>=2?`<div class="hist-chart-label">勝率走勢</div>${winSparkline(rolling,{w:560,h:100})}`:''}
      ${cats.length>=3?`<div class="hist-chart-label" style="margin-top:16px">各分類勝率</div>${catBarChart(cats,{w:560,barH:20,gap:5})}`:''}
      <div class="hist-insight" style="margin-top:14px">
        ${strong.length?`<div class="banner info">${icon('star',16)}<div><b>真實強項</b>：${strong.map((c)=>`${c.label}（${(c.winRate*100).toFixed(0)}%，${c.played}場）`).join('、')}</div></div>`:''}
        ${weak.length?`<div class="banner warn" style="margin-top:8px">${icon('alert',16)}<div><b>真實弱項</b>：${weak.map((c)=>`${c.label}（${(c.winRate*100).toFixed(0)}%，${c.played}場）`).join('、')}</div></div>`:''}
        ${!strong.length&&!weak.length?`<p class="muted">再多記幾週後，這裡會自動分析你的真實強弱項。</p>`:''}
      </div>`;
    }

    // history list
    setHtml($('#hList'), !matches.length ? emptyState('還沒有記錄','','info') : matches.map((m)=>`
      <div class="hrow"><div class="hrow-top">
        <span class="hrow-week">${esc(m.weekLabel)}</span>
        <span class="hrow-res ${RESULT_CLS[m.result]}">${RESULT_LABEL[m.result]}</span>
        ${m.opponent?`<span class="muted">vs ${esc(m.opponent)}</span>`:''}
        ${m.score.w||m.score.l?`<span class="tiny muted">${m.score.w}W-${m.score.l}L${m.score.t?'-'+m.score.t+'T':''}</span>`:''}
        ${m.myStats&&Object.values(m.myStats).some((v)=>v!=null)?`<span class="badge b-blue" style="font-size:10px">含數據</span>`:''}
        <div style="margin-left:auto;display:flex;gap:4px">
          <button class="btn small ghost" data-act="open-detail" data-id="${esc(m.id)}" data-testid="h-detail-${esc(m.id)}">詳細</button>
          <button class="icon-btn" data-act="delete-match" data-id="${esc(m.id)}" style="width:28px;height:28px">${icon('trash',14)}</button>
        </div>
      </div>
      ${Object.keys(m.catResults??{}).length?`<div class="hrow-cats">${Object.entries(m.catResults).map(([c,v])=>`<span class="hcat-tag ${v}">${esc(c)}</span>`).join('')}</div>`:''}
      ${m.note?`<div class="tiny muted" style="margin-top:4px">${esc(m.note)}</div>`:''}
    </div>`).join(''));
  }

// CSV parsing + normalization into player stat records. Ported from V4.0.21 fromCsv()/makePlayer(), hardened:
//  - missing cells stay null (never coerced to 0)
//  - per-game vs season-total detection is done once per FILE, not guessed per row
//  - players with GP = 0 are kept as identity records (status 'no-games') instead of being dropped
//  - dd/td columns are read when present (DD_MAP / TD_MAP are only a fallback)

  p3m: ['fg3m', 'three_point_made', 'three_fg', 'three_fgm', 'three_point_field_goals_made', '3pm'],
  p3a: ['fg3a', 'three_point_attempted', 'three_attempts', 'three_fga', 'three_point_field_goals_attempted', '3pa'],
  ftm: ['ftm', 'ft', 'free_throws_made', 'one_point_made'], fta: ['fta', 'ft_attempts', 'free_throw_attempts', 'one_point_attempted'],
  reb: ['reb', 'total_rebounds', 'totalrb', 'total_rb', 'trb'], ast: ['ast', 'ast_total', 'assists'],
  stl: ['stl', 'steals'], blk: ['blk', 'blocks'], tov: ['tov', 'to', 'turnovers'], pts: ['pts', 'points'],
  min: ['min', 'minutes', 'minutes_played'], mpg: ['mpg', 'min_per_game'],

// Weekly H2H match history — stored per-league.
// MatchRecord v2: now includes full weekly stat totals for both sides.
// { id, week, weekLabel, season, result:'W'|'L'|'T', score:{w,l,t},
//   catResults:{[label]:'win'|'loss'|'tie'},
//   myStats:{[label]:number|null},     // actual weekly totals for my team
//   oppStats:{[label]:number|null},    // actual weekly totals for opponent
//   opponent, note, recordedAt }
const { NS } = __req("state/storage");

const HISTORY_KEY = 'h2h.history';
// All trackable stat labels (standard + custom can extend via customH2HCats)
const STAT_LABELS = ['FG%','FT%','3P%','FGM','FTM','3PM','PTS','REB','AST','STL','BLK','TOV','DD','A/T'];
const PCT_LABELS  = new Set(['FG%','FT%','3P%','A/T']);
const REVERSE_LABELS = new Set(['TOV']);

function loadHistory(storage) { return storage.getJSON(HISTORY_KEY, {}); }
function saveHistory(storage, data) { return storage.setJSON(HISTORY_KEY, data); }

function getLeagueMatches(data, leagueId) {
  return (data[leagueId]?.matches ?? []).slice().sort((a, b) =>
    b.week - a.week || (b.recordedAt ?? '').localeCompare(a.recordedAt ?? ''));
}

function addMatch(data, leagueId, match) {
  const league = data[leagueId] ?? { matches: [] };
  const idx = league.matches.findIndex((m) => m.week === match.week && m.season === match.season);
  const updated = idx >= 0
    ? league.matches.map((m, i) => (i === idx ? { ...match } : m))
    : [...league.matches, { ...match }];
  return { ...data, [leagueId]: { ...league, matches: updated } };
}

function deleteMatch(data, leagueId, matchId) {
  const league = data[leagueId]; if (!league) return data;
  return { ...data, [leagueId]: { ...league, matches: league.matches.filter((m) => m.id !== matchId) } };
}

/** Build a "my actual" dataset from all matches that have myStats filled in. */
function buildActualDataset(matches) {
  const withStats = matches.filter((m) => m.myStats && Object.values(m.myStats).some((v) => v != null));
  if (!withStats.length) return null;
  // per-category: running total / count -> average
  const totals = {}; const counts = {};
  for (const m of withStats) {
    for (const [k, v] of Object.entries(m.myStats ?? {})) {
      if (v == null || isNaN(Number(v))) continue;
      totals[k] = (totals[k] ?? 0) + Number(v);
      counts[k] = (counts[k] ?? 0) + 1;
    }
  }
  const avgs = Object.fromEntries(Object.keys(totals).map((k) => [k, totals[k] / counts[k]]));
  return { weeks: withStats.length, avgs, matches: withStats };
}

/** Aggregate stats across matches for the analysis panel. */
function analyzeHistory(matches) {
  if (!matches.length) return null;
  const total = { W: 0, L: 0, T: 0 };
  const catTotals = {};
  for (const m of matches) {
    total[m.result] = (total[m.result] || 0) + 1;

      if (!catTotals[label]) catTotals[label] = { win: 0, loss: 0, tie: 0 };
      catTotals[label][res] = (catTotals[label][res] || 0) + 1;
    }
  }
  const cats = Object.entries(catTotals).map(([label, r]) => {
    const played = r.win + r.loss + r.tie;
    return { label, ...r, played, winRate: played ? r.win / played : 0 };

  const strong = cats.filter((c) => c.winRate >= 0.6 && c.played >= 2);
  const weak   = cats.filter((c) => c.winRate <= 0.4 && c.played >= 2);
  const rolling = matches.slice().sort((a, b) => a.week - b.week).map((m, i, arr) => {
    const slice = arr.slice(0, i + 1);
    const w = slice.filter((x) => x.result === 'W').length;
    return { week: m.week, weekLabel: m.weekLabel, result: m.result,
      w, l: slice.filter((x) => x.result === 'L').length,
      t: slice.filter((x) => x.result === 'T').length, winPct: w / (i + 1) };
